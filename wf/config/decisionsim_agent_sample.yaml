run_id: decisionsim_agent_sample
# Stage 1b (notes/decisionsim_agent_design.md; wf/decisionsim_agent.py). The agent's frozen ranked candidate lists at every decision
# point of the 134 RQ3 no-foresight episodes (2,973 states): rank 1 the archived greedy action, then up to 7 distinct
# actions from 20 samples at temperature 1 (top-p 1, no top-k), ranked by count, ties by a seeded hash. GPU (vLLM, the
# pinned Qwen3-8B) and the ALFWorld server; WF_SHARD / WF_N_SHARDS split it by game. episodes_source is a run under
# runs/ or an absolute path to the RQ3 run (commit ddeabc2).
episodes_source: rq3
split: valid_unseen
n_samples: 20
temperature: 1.0
top_p: 1.0
max_tokens: 256
k_max: 8
seed: 20260924
n_shards: 4
