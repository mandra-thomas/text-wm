# Minimal pilot, CPU analysis (amendment 1, section M; amendment 2): the pre-registered readouts per stratum (step 0,
# later, all; pooled numbers weighted back to the population), the ablation depth profile and its onset layer, the
# H4 rows with their null baselines, the hidden-state probe (descriptive), and the calibration rule's output (the
# full pilot's sample size for a half-width of 0.075). No GPU; numpy and scikit-learn.
