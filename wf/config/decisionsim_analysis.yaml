  llama3.1-8b: decisionsim_score_llama3.1-8b
  mistral-7b-v0.3: decisionsim_score_mistral-7b-v0.3
  gemma2-9b-it: decisionsim_score_gemma2-9b-it
  llama3.2-3b: decisionsim_score_llama3.2-3b
