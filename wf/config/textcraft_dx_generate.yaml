run_id: textcraft_dx_generate
# Exploratory, post hoc (notes/textcraft_llama_dx.md, runs 2 and 5): under the verified prompt, Llama's greedy free
# generation of the next observation (40 new tokens at most), its ten most probable first tokens, and its free answer
# to the yes/no question (4 new tokens at most), under the aligned, swapped and neutral lines, on seeded goal-role and
# ingredient couples of the main and success populations (its own seeds: held out from the other runs' draws).
manifest: wf/textcraft/data/manifest.json
mode: generate
models: [llama3.1-8b-fewshot]
max_new_tokens: 40
yn_tokens: 4
top_k: 10
blocks:
  - {population: main, couples: 60, role: goal}
  - {population: main, couples: 30, role: ingredient}
  - {population: success, couples: 30, role: goal}
  - {population: success, couples: 30, role: ingredient}
