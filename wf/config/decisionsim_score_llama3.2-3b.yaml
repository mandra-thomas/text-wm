run_id: decisionsim_score_llama3.2-3b
# Option A decision simulation (notes/decisionsim_design.md; wf/decisionsim.py). Yes/no feasibility scores of every
# candidate at all 761 eligible states (9,930 candidates in 134 games), under the aligned, neutral and swapped task
# (the swapped one at the 709 states where it is defined) and with no task (the task-blind verifier: the first
# observation's task sentence removed): 38,986 single-token passes, at the pinned revision in wf.constants.REVISIONS.
# Census and swapped arm adopted after review 1, task-blind arm in Stage 1a, both before any score. Every condition
# of a state is scored in the same job. WF_N_SHARDS / WF_SHARD split it by game.
model: llama3.2-3b
sources: [rq12_transitions_s0, rq12_transitions_s1, rq12_transitions_s2]
n_states: all
seed: 20260924
arms: [yn_aligned, yn_absent, yn_swapped, yn_blind]
n_shards: 1
accept_commits:
  rq12_transitions_s0: ["f8d20c1"]
  rq12_transitions_s1: ["f8d20c1"]
  rq12_transitions_s2: ["f8d20c1"]
